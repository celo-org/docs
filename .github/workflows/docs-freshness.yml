# Monthly check of directory-style pages (ramps, exchanges, wallets, bridges, providers,
# grants, stablecoins, agent tooling) against their sources of truth.
#
# Registry: .github/freshness/pages.yml   Procedure: .github/freshness/RUNBOOK.md
# Output: a draft PR with source-confirmed updates and an issue with open questions.
# Nothing merges without review.
#
# One-time setup:
#   - Install the Claude GitHub App on this repo (https://github.com/apps/claude) and add the
#     ANTHROPIC_API_KEY secret. Leave github_token unset so the action uses the App's token:
#     PRs opened with the default GITHUB_TOKEN do not trigger docs-validation.yml.
#   - Repository variable FRESHNESS_MAINTAINER = GitHub handle to assign the questions issue to.
name: Docs freshness

on:
  schedule:
    - cron: "0 7 1 * *" # 07:00 UTC on the 1st of every month
  workflow_dispatch:
    inputs:
      pages:
        description: "Space-separated paths to check regardless of due date (empty = all due pages)"
        required: false
        default: ""
      max_pages:
        description: "Maximum pages to check this run"
        required: false
        default: "25"

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write # lets claude-code-action exchange OIDC for the Claude GitHub App token

concurrency:
  group: docs-freshness
  cancel-in-progress: false

# Same pin as docs-validation.yml; bump them together.
env:
  MINTLIFY_VERSION: "4.2.920"

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the runbook reads git history to find stale pages
          # Leave no GITHUB_TOKEN in .git/config. claude-code-action points origin at its
          # Claude GitHub App token, so the freshness branch is pushed with the App token
          # (a push with GITHUB_TOKEN would not trigger docs-validation.yml on the PR).
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install Foundry (cast, for on-chain checks)
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1

      - name: Install Python dependencies and set the run date
        run: |
          python -m pip install "pyyaml==6.0.4"
          echo "RUN_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Prefetch the pinned Mintlify CLI
        run: npx -y mintlify@${{ env.MINTLIFY_VERSION }} --version

      # The agent may run only the commands the runbook needs, each as written there.
      # No curl, node, python3 or bare npx: links are fetched with WebFetch.
      - name: Run the freshness check
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Follow .github/freshness/RUNBOOK.md exactly, in repository ${{ github.repository }}.
            Read AGENTS.md first.
            Inputs:
            - RUN_DATE: ${{ env.RUN_DATE }}
            - FORCE_PAGES: ${{ inputs.pages }}
            - MAX_PAGES: ${{ inputs.max_pages || '25' }}
            - MAINTAINER: ${{ vars.FRESHNESS_MAINTAINER }}
            - RUN_NUMBER: ${{ github.run_number }}
            - MINTLIFY_VERSION: ${{ env.MINTLIFY_VERSION }}
            Use git for the branch push and `gh` for the draft PR and the issue.
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 400
            --allowedTools
              "Read" "Edit" "Write" "Glob" "Grep" "WebFetch" "WebSearch"
              "Bash(git log:*)" "Bash(git status)" "Bash(git diff:*)" "Bash(git ls-remote:*)"
              "Bash(git checkout -b:*)" "Bash(git add:*)" "Bash(git commit:*)" "Bash(git push -u origin:*)"
              "Bash(npx mintlify@${{ env.MINTLIFY_VERSION }} broken-links)"
              "Bash(npx -p mintlify@${{ env.MINTLIFY_VERSION }} -c 'node scripts/check_components.mjs')"
              "Bash(python3 scripts/check_redirects.py)"
              "Bash(python3 .github/freshness/check_registry.py)"
              "Bash(cast call:*)" "Bash(cast code:*)" "Bash(npm view:*)"
              "Bash(gh pr create:*)" "Bash(gh issue create:*)" "Bash(gh issue comment:*)" "Bash(gh issue list:*)"
              "Bash(grep:*)" "Bash(date:*)"
