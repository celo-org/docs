# Registry of docs pages whose facts change as the outside world changes:
# providers, partners, programs, ecosystem numbers, token lists.
#
# The monthly freshness run (.github/workflows/docs-freshness.yml) reads this file,
# checks every page that is due against its sources, and records the result.
# Procedure: .github/freshness/RUNBOOK.md
#
# Fields
#   path           page to check (repo-relative)
#   cadence        monthly | quarterly
#   last_verified  YYYY-MM-DD the run last confirmed every listed fact, or null
#                  (null = never fully verified; due on the next run)
#   what           the facts on the page that go stale
#   sources        canonical sources beyond the links already on the page.
#                  Every external link on the page is always checked as well.
#   generated_by   the page is generated: compare with the source, never hand-edit;
#                  raise a question to rerun the generator instead
#   celopedia      matching reference files in celo-org/celopedia-skills
#                  (skills/celopedia-skill/references/), synced by its own run
#
# Adding a directory-style page to the docs? Add it here in the same PR (AGENTS.md §7).

pages:
  # ---------------------------------------------------------------- monthly
  - path: learn/ramps.mdx
    cadence: monthly
    last_verified: null
    what: >-
      On/off-ramp providers: whether each still supports Celo, supported countries,
      payment methods, Celo assets offered; the provider count in the intro
    sources:
      - https://celo.org/ecosystem
    celopedia: [ecosystem.md, wfiat-access.md]

  - path: learn/exchanges.mdx
    cadence: monthly
    last_verified: null
    what: Centralized and decentralized exchanges listing CELO or Celo stablecoins
    sources:
      - https://celo.org/ecosystem
      - https://api.coingecko.com/api/v3/coins/celo/tickers (exchange listings)
    celopedia: [ecosystem.md]

  - path: learn/wallets.mdx
    cadence: monthly
    last_verified: null
    what: Consumer wallets supporting Celo, their platforms and features
    sources:
      - https://celo.org/ecosystem
    celopedia: [ecosystem.md]

  - path: build/build-with-local-stablecoin.mdx
    cadence: monthly
    last_verified: null
    what: >-
      Stablecoin count ("30+"), the 15 Mento stablecoins, third-party issuers and
      what each issuer offers on Celo
    sources:
      - https://www.mento.org
      - https://github.com/mento-protocol
    celopedia: [stablecoin-orchestration.md, contracts.md]

  - path: build/tools/contracts/stablecoin-contracts.mdx
    cadence: monthly
    last_verified: null
    what: Stablecoin addresses on mainnet and Celo Sepolia; issuer wind-down notes
    generated_by: scripts/update_contracts.py (third-party rows from scripts/data/stablecoins.json)
    sources:
      - onchain:FeeCurrencyDirectory.getCurrencies() on mainnet and Celo Sepolia
    celopedia: [contracts.md, stablecoin-orchestration.md]

  - path: build/tools/contracts/fee-currencies.mdx
    cadence: monthly
    last_verified: null
    what: Tokens on the fee-currency allowlist and their adapter addresses
    generated_by: scripts/update_contracts.py
    sources:
      - onchain:FeeCurrencyDirectory.getCurrencies() on mainnet and Celo Sepolia
    celopedia: [contracts.md, network-info.md]

  - path: learn/bridged-tokens/bridges.mdx
    cadence: monthly
    last_verified: null
    what: Bridges for users and the bridged tokens they carry to Celo
    sources:
      - https://superbridge.app
    celopedia: [ecosystem.md]

  - path: build/tools/bridges/bridges.mdx
    cadence: monthly
    last_verified: null
    what: Bridge providers for developers (cards), whether each still supports Celo
    celopedia: [ecosystem.md, builder-guide.md]

  - path: build/mini-apps/overview.mdx
    cadence: monthly
    last_verified: null
